<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Local Services Marketplace{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
    </nav>
    <hr>
    {% with messages = get_flashed_messages() %}
    {% for message in messages %}
        <p><strong>{{ message }}</strong></p>
    {% endfor %}
{% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
